# P ≠ NP: The Fifty-Year Wall, Fine-Grained Science, Cryptography's Foundation, and the World After a Collapse

In 1971, Stephen Cook proved that Boolean satisfiability (SAT) is NP-hard — every problem whose solutions can be checked in polynomial time can be encoded as a SAT instance — and asked whether SAT can also be solved in polynomial time. Leonid Levin independently formulated the same question (published 1973), and in 1972 Richard Karp showed that 21 classical combinatorial problems — Hamiltonian cycle, Traveling Salesman, Clique, Subset Sum, k-Colorability, and others — are all polynomial-time reducible to SAT. One question absorbed them all: **is P = NP?** If any single NP-complete problem has a polynomial-time algorithm, then every NP-complete problem does, and P = NP. If any one of the more than 3,000 known NP-complete problems provably lacks one, then P ≠ NP. The Clay Mathematics Institute put US$1,000,000 on the answer in 2000. Fifty-plus years later, neither side has moved: no polynomial-time algorithm for any NP-complete problem, and no superpolynomial lower bound for any explicit function against unrestricted circuits.

The stakes are asymmetric in an uncomfortable way. A proof of P ≠ NP would confirm what most complexity theorists already believe — in 2002 and again in 2019, polls of researchers put heavy majorities on the P ≠ NP side. A proof of P = NP with a practical algorithm would rewrite the operating system of civilization: it would collapse public-key cryptography, make the exhaustive search behind credit-card-key recovery a polynomial-time task, and, as Cook observed in his official problem description, allow a computer to find a formal proof of any theorem with a reasonable-length proof — plausibly all seven Millennium Prize Problems at once. This article covers why the proof stays out of reach, what fine-grained complexity theory salvaged from the impasse, how cryptography sits on exactly the assumption P ≠ NP does *not* quite imply, and what defenses exist if the assumption ever fails.

---

## 1. Why Can't We Prove It?

### 1.1 The embarrassingly low ceiling of circuit lower bounds

P vs NP is, at its core, a lower-bound problem: show that SAT requires superpolynomial-size circuits. The ground truth is stark. Shannon's 1949 counting argument shows that *almost all* Boolean functions on n inputs require roughly 2^n/n gates — yet for any *explicit* function in NP, the best known lower bound against unrestricted circuits is **5n − o(n)** (Find, Golovnev, Hirsch, and Kulikov, 2016). We cannot even prove that an NP-complete function needs six gates per input bit. The strongest unconditional lower bound against general circuits is Kannan's theorem, which places explicit functions outside SIZE(n^k) for every fixed k — but only for functions in Σ₂^P ∩ Π₂^P (and hence outside P/poly at the NEXP level), two polynomial-hierarchy levels above NP. Between "5n" and "superpolynomial" there is a fifty-year desert.

### 1.2 Barrier I: Relativization (Baker–Gill–Solovay, 1975)

Diagonalization — the technique that separated P from EXP and the primitive-recursive classes — relativizes: it continues to work when every machine gets access to the same oracle. Baker, Gill, and Solovay (1975) constructed oracle A relative to which P^A = NP^A, and oracle B relative to which P^B ≠ NP^B. Any proof technique that relativizes proves statements true in *both* worlds, and therefore cannot resolve the unrelativized question. Every diagonalization-based argument, including most of classical complexity theory, is blind to P vs NP. The oracle worlds also carry a warning: P = NP is not an arithmetic inevitability but a delicate, contingent fact about *this* computational universe.

### 1.3 Barrier II: Natural Proofs (Razborov–Rudich, 1994; journal 1997)

By the early 1990s, circuit complexity was considered the most promising route to P ≠ NP, and Razborov's 1985 monotone-circuit lower bound — clique needs n^{Ω(log n)} monotone gates — looked like the opening move of a winning sequence. Then Razborov and Rudich analyzed every known lower-bound technique and found a shared two-part structure, which they called a *natural proof*:

1. **Constructivity**: the proof identifies a combinatorial property C of Boolean functions that can be checked in polynomial time on a function's full truth table (a table of 2^n entries), and C holds for a non-negligible fraction of all functions.
2. **Usefulness**: C is possessed by no function computable by circuits of the target size — every member of the circuit class C fails C.

Every prior lower-bound argument — parity ∉ AC⁰, Razborov's monotone clique bound — fits this template, and Rudich showed they "naturalize": the techniques transfer into the framework wholesale. The catastrophe is the second half of the paper. If pseudorandom function generators exist — i.e., if cryptography works — then a random-looking function and a PRF-generated function are computationally indistinguishable. A constructive, efficiently checkable property satisfied by random functions but violated by all small-circuit functions would *be* a PRF-breaking distinguisher. So a natural proof that separates P from P/poly would yield a polynomial-time attack on every PRF, and with them the one-way functions underlying signatures, key exchange, and secure communication. Razborov and Rudich's own phrasing: working on lower bounds by natural methods "is like breaking a secret code determined by the class we are working against." The assumption that makes cryptography possible is the same one that makes natural lower-bound proofs impossible. Proving P ≠ NP *the standard way* is, in a precise sense, at least as hard as breaking all of modern cryptography.

Two later developments sharpen the dilemma into an operational statement. Impagliazzo, Kabanets, and Kolokolova's "Almost-Natural Proofs" (FOCS 2008; J. Comput. Syst. Sci. 2010) extended the barrier to derandomization: a natural property useful against P/poly would derandomize the class AM, tying any natural lower bound directly to collapse consequences. And Eric Miles ("Substitution-Permutation Networks, Pseudorandom Functions, and Natural Proofs," CRYPTO 2012; J. ACM 2015) made the constructive half of Razborov–Rudich literal: his paper exhibits natural-proofs-style properties that serve as *working attacks* on SPN block ciphers of the AES family. In Miles' construction, the lower-bound technique and the cryptanalytic distinguisher are the same algorithm run on different inputs — the barrier is not a philosophical warning but a working tool.

### 1.4 Barrier III: Algebrization (Aaronson–Wigderson, 2008)

After relativization, the field's hope shifted to *arithmetization* — encoding Boolean computations as low-degree polynomials over finite fields, the tool behind the IP = PSPACE and PCP theorems. Aaronson and Wigderson's "Algebrization: A New Barrier in Complexity Theory" (2008) defined *algebraic oracles* — oracles that answer both membership and low-degree-extension queries — and showed that oracle worlds exist in which such oracles separate the relevant classes in both directions. Techniques that arithmetize cannot resolve P vs NP either. The three barriers now jointly veto: diagonalization (relativization), circuit lower-bound templates (natural proofs), and arithmetization-based relativizations (algebrization). Nearly the entire proof toolbox of 20th-century complexity theory is ruled out.

### 1.5 Proof complexity: the search side fails too

An alternative to proving lower bounds is *searching* for them: SAT solvers as automated mathematicians. Proof complexity closes this route as well. Haken (1985) proved that any resolution refutation of the pigeonhole principle requires 2^{Ω(n)} clauses; CDCL SAT solvers — the industrial workhorses that routinely handle million-variable instances — polynomially simulate resolution, so their worst-case exponential behavior is a theorem, not an engineering shortfall. For stronger systems (Frege proofs, bounded arithmetic), no superpolynomial lower bounds are even known — the same blindness, one level up. Note the asymmetry the barriers create: if P = NP, then SAT ∈ P and short proofs of tautologies would be *findable* in polynomial time (search reduces to decision). If P ≠ NP, we cannot prove it without evading all three barriers.

### 1.6 The two live research programs

Two approaches claim a path around the walls. **Ryan Williams' algorithmic method** (2011) inverts the traditional pipeline: rather than proving a lower bound directly, design a *faster-than-trivial Circuit-SAT algorithm* for a circuit class C — a 2^n/poly(n) improvement — which automatically yields explicit functions outside C. Executed on ACC⁰ circuits, this produced NEXP ⊄ ACC⁰, the first new general-circuit lower bound in decades. The method's reach is bounded by the difficulty of the SAT algorithms themselves, and for unrestricted circuits the required algorithmic breakthrough is precisely as hard as the lower bound — a duality rather than an escape. **Geometric Complexity Theory** (Mulmuley–Sohoni) recasts P vs NP as the orbit-closure separation of the permanent and determinant polynomials, attacking it with representation theory and algebraic geometry in a way that is deliberately non-natural; despite significant progress on the "chasm at depth three" reductions (Gupta–Kamath–Kayal–Saptharishi), the full program remains unfinished. Aaronson's survey "P=?NP" (2016) catalogs the residue: the barriers transformed our understanding of what a P ≠ NP proof *could* look like — "ironic complexity theory," multiplicative-weights dualities between algorithms and impossibility — while the wall itself stands. He also named the empirical pattern the "invisible fence": NP-completeness reductions and polynomial-time algorithms approach each other from opposite sides on thousands of problems and "miraculously" never meet.

### 1.7 Meta-complexity: the barrier becomes a problem

The constructive property at the heart of Razborov–Rudich now has a canonical name: it is a question about the **Minimum Circuit Size Problem (MCSP)** — given a truth table of 2^n bits and a size bound s, decide whether some circuit of size s computes that table. A natural proof is exactly an efficient procedure separating easy truth tables from pseudorandom ones; in other words, an average-case MCSP algorithm. This reframing turned the barrier into its own research program — *meta-complexity*, the study of problems about computation itself — with results that quantified the dilemma:

- **MCSP's worst-case status is itself unresolved and structured.** NP-hardness is known for restricted circuit families (Hirahara–Oliveira–Santhanam, FOCS 2018, OR-AND-MOD circuits), SAT reduces to MCSP in the presence of a random oracle (Ilango, FOCS 2023), structural limits trace back to Hitchcock–Pavan (FSTTCS 2015), and Santhanam (2019) connected MCSP directly to pseudorandomness.
- **The cryptography equivalence is now a theorem.** Liu and Pass ("On One-Way Functions and Kolmogorov Complexity," FOCS 2020) proved that one-way functions exist *if and only if* time-bounded Kolmogorov complexity is mildly hard on average — collapsing the worst-case/average-case gap of Section 3 for a canonical problem: either OWFs exist, or computing K^t complexity on random strings is easy. Liu–Pass ("On One-Way Functions from NP-Complete Problems," CCC 2022) pushed the bridge further toward ordinary NP-complete problems.
- **The barrier is now quantitative.** One object — an efficient distinguisher on truth tables — is simultaneously the shape any natural P ≠ NP proof must take, a working attack on PRFs when instantiated on block ciphers (Miles 2012), and a problem with its own worst-case and average-case hardness theory. Sections 1 and 3 of this article meet here.

## 2. Fine-Grained Complexity Theory

### 2.1 Why the coarse dichotomy stopped being enough

P vs NP is binary: solvable in n^c time for *some* constant c, or not solvable at all in polynomial time. It says nothing about the problems *inside* P — whether the classical n³ All-Pairs Shortest Paths algorithm is optimal, whether the n²·log n dynamic-programming edit distance can be beaten, whether every n² 3SUM algorithm is a wall. Fine-grained complexity theory, built mostly in the 2000s and 2010s, converts this void into quantitative science: it produces conditional lower bounds of the form *problem X requires n^{a−o(1)} time unless conjecture Y is false*, where the exponent a is tight.

### 2.2 The three pillars

**SETH — the Strong Exponential Time Hypothesis** (Impagliazzo–Paturi, 2001): for every ε > 0, k-SAT on n variables requires 2^{(1−ε)n} time. The sparsification lemma (Impagliazzo–Paturi–Zane, 2001) reduces arbitrary k-CNF formulas to O(2^{δn}) many sparse ones, making SETH the quantitative refinement of "SAT is not in 2^{o(n)}" — the base-2 constant is the measure. SETH is the strongest of the standard conjectures, and everything else reduces *from* it.

**The Orthogonal Vectors conjecture (OV)**: given n vectors in {0,1}^d with d = ω(log n), deciding whether some pair has zero inner product requires n^{2−o(1)} time. Williams (FOCS 2005) reduced CNF-SAT to k-OV, transferring SETH into a purely combinatorial, algebra-friendly form: refute n^{2−ε} for OV and you refute SETH. Ryan Williams' own O(1.999^n) SAT algorithm and the Abboud–Vassilevska Williams–Yu n^{2−1/o(log d)} OV algorithm mark the current frontier — real progress, but no ε.

**3SUM and APSP**: 3SUM — does a triple in a set of n numbers sum to zero? — is conjectured to require n^{2−o(1)} time (folklore since Gajentaan–Overmars, 1995, in computational geometry). All-Pairs Shortest Paths is conjectured to require n^{3−o(1)}. Vassilevska Williams and Williams (2010) showed these conjectures are inter-reducible through the (min,+) product and negative triangle detection: a genuinely subcubic negative-triangle algorithm would break both APSP and 3SUM's cubic and quadratic barriers simultaneously. The three pillars form a web of conditional equivalences rather than isolated guesses.

### 2.3 The harvest: quadratic walls everywhere

Once the conjectures were in place, fine-grained reductions fell like dominoes, most in 2014–2018:

- **Edit distance**: Backurs and Indyk (STOC 2015) proved that computing edit distance in truly subquadratic time — O(n^{2−ε}) for any ε > 0 — refutes SETH. The classical Wagner–Fischer O(n²) dynamic program, unchanged since 1974, is conditionally optimal. The same holds for Longest Common Subsequence and Fréchet distance (Abboud–Backurs–Vassilevska Williams; Bringmann–Künnemann).
- **Dynamic graph problems**: Abboud and Vassilevska Williams (2014) showed that SETH, 3SUM, or APSP imply that a truly subquadratic fully-dynamic reachability or subcubic APSP-update algorithm is impossible — conditioning the entire field of dynamic algorithms.
- **Hardness in P**: network flow, k-median clustering, jumbled indexing, and dozens of core problems received matching conditional lower bounds, each traced back to one of the three conjectures.
- **NSETH and the BPTIME barrier**: Carmosino, Gao, Impagliazzo, Mikhalev, Ramamoorthy, and Sipser (ITCS 2016) formulated *nondeterministic* SETH and proved that even NSETH (let alone SETH) implies there is no deterministic reduction from SAT to co-nondeterministic problems running in strongly subexponential time — a Williams-style barrier showing that the known web of reductions is, in a precise sense, maximal.

### 2.4 What fine-grained theory bought, and what it still owes

The payoff is real: algorithm designers now know which exponents are believed optimal before spending years attacking them, and the conjectures have correctly flagged the cases where surprises were possible (APSP on sparse graphs, All-Pairs computations in low-treewidth graphs — Lokshtanov–Marx–Saurabh's "probably optimal" program). The debt is epistemic: every fine-grained lower bound is *conditional*, and proving SETH, OV, 3SUM, or APSP unconditionally would require exactly the superpolynomial-circuit lower bounds that Section 1 showed are walled off by relativization, natural proofs, and algebrization. Fine-grained complexity is P vs NP's quantitatively productive sibling, still chained to the same open core. There is, however, a two-way trade: a proof that SETH is false — a 2^{(1−ε)n} k-SAT algorithm — would not merely settle one hypothesis but cascade through the entire conditional-lower-bound literature, refuting hundreds of published optimality results at once. Either resolution of the SETH question rewrites the field, which is why the three-pillar web, not P vs NP itself, is where the day-to-day action lives.

### 2.5 Fine-grained cryptography

A younger branch runs the conditional-lower-bound machinery in the opposite direction: instead of assuming superpolynomial hardness, it builds protocols whose security is *quantified in polynomial exponents*. Ball, Rosen, Sabin, and Vasudevan ("Fine-Grained Cryptography," ASIACRYPT 2016; "Proofs of Useful Work," STOC 2017) constructed oblivious transfer, key agreement, signatures, and proof-of-work under fine-grained assumptions — SETH/OV/3SUM-style statements guaranteeing that honest parties run in n^a time while adversaries provably require n^{a+ε}. LaVigne, Lincoln, and Vassilevska Williams ("Fine-Grained Cryptography Revisited," CT-RSA 2019) extended the constructions under SETH, 3SUM, and APSP to more primitives, and the program continues ("On Sequential Functions and Fine-Grained Cryptography," ASIACRYPT 2024). Two consequences matter for this article. First, this is the first cryptography whose security model is measured in exponent gaps rather than superpolynomial assumptions — the formal counterpart to the Layer-4 defense in Section 4.4, and the natural framework if P = NP were ever resolved with a large exponent. Second, proofs of useful work formally separate the two roles that proof-of-work's computation plays under classical assumptions: today the expended work must be verifiable-but-worthless; under fine-grained hardness it can simultaneously secure a protocol and perform genuinely useful distributed computation.

## 3. Cryptographic Foundations and One-Way Functions

### 3.1 The weakest primitive everything stands on

A **one-way function (OWF)** is an efficiently computable f such that for random input x, no polynomial-time adversary can produce x′ with f(x′) = f(x) except with negligible probability. It is the minimum assumption of theoretical cryptography: pseudorandom generators follow from OWFs (Håstad–Impagliazzo–Levin–Luby), pseudorandom function families follow from PRGs (Goldreich–Goldwasser–Micali, 1986), and digital signatures follow from OWFs (Rompel, 1990). Symmetric encryption, message authentication, commitments, and zero-knowledge proofs all sit on the same foundation. Public-key cryptography requires strictly more — trapdoor structure — but OWFs are the floor.

### 3.2 The direction of the implication, and the gap

The relationship to P vs NP is precise and, on one side, mildly surprising. **OWF ⇒ P ≠ NP** is immediate: if every efficiently computable function were polynomial-time invertible on average — which P = NP delivers, since preimage-finding is an NP search problem — then no OWF exists. Aaronson's survey stresses how weak the premise is: a one-way function needs no algebraic structure; the evolution rule of an arbitrary cellular automaton, or any scrambling operation composed a thousand times, would suffice. **P ≠ NP does *not* imply OWFs.** P ≠ NP is a worst-case statement about uniform algorithms on adversarially chosen instances; an OWF is an average-case statement about random instances of one specific function family. Complexity theory knows both directions of the gap: Levin's average-case complexity theory formalizes it, and Impagliazzo's five-worlds taxonomy (below) shows that between P ≠ NP and OWFs lies an entire spectrum of worlds in which one holds without the other. The one major exception bridging worst and average case is lattice cryptography: Ajtai (1996) proved that breaking random lattice instances (SIS) is *as hard as* solving worst-case lattice approximation problems, and the Ajtai–Dwork cryptosystem pushed this to public-key encryption. But Ajtai's reduction is still an implication *within* computational hardness — it collapses entirely if P = NP. The gap is, however, provably tight at the level of meta-computational problems: Liu and Pass (FOCS 2020) proved that OWFs exist if and only if time-bounded Kolmogorov complexity is mildly hard on average — for this canonical problem, worst-case, average-case, and cryptographic hardness align exactly (Section 1.7).

### 3.3 Impagliazzo's five worlds

Russell Impagliazzo's 1995 paper "A Personal View of Average-Case Complexity" split the possible resolutions of P vs NP and the average-case question into five worlds. The taxonomy remains the field's shared map of what cryptography gets under each outcome:

| World | What holds | What cryptography gets |
|---|---|---|
| **Algorithmica** | P = NP (or morally equivalent: fast randomized algorithms for NP) | Nothing. All computational assumptions false; key recovery, preimages, collisions all polynomial-time. |
| **Heuristica** | NP problems hard worst-case, easy on average | Unreliable. Security depends on distribution; no provable guarantees. |
| **Pessiland** | Average-case hard NP problems, but no OWFs | Nothing — the worst world: hardness exists but yields no cryptographic advantage. |
| **Minicrypt** | OWFs exist, but no public-key cryptography | Symmetric crypto, hashing, signatures with shared keys; no key exchange, no public-key encryption. |
| **Cryptomania** | Public-key cryptography exists (key agreement, trapdoors) | Everything: secure multi-party computation, electronic cash, the current Internet's trust model. |

Most theorists put us in Cryptomania or Minicrypt; nobody can prove which. P vs NP resolves only one bit of this spectrum — it separates Algorithmica from the other four — while the cryptography-relevant structure (Pessiland vs Minicrypt vs Cryptomania) lives entirely in the average-case regime that P vs NP does not touch.

### 3.4 The circularity the barriers expose

Impagliazzo and Rudich (STOC 1989) proved a relativized result that completes the picture: in an oracle world where P = NP, no key-agreement protocol exists — black-box techniques cannot build public-key crypto on anything weaker than genuine hardness. Combined with Razborov–Rudich, a striking circularity emerges. Natural proofs say: *if* OWFs exist, *then* no natural proof separates P from P/poly. Contrapositive: anyone who proves P ≠ NP by natural means has, constructively, broken PRFs. The lower-bound problem and the cryptanalysis problem are two views of the same object. As the natural-proofs literature puts it, lower-bound work by natural methods is indistinguishable from codebreaking — and the entire field of cryptography is, in Impagliazzo's framing, about *making* the P = NP assumption false in practice even if it were true in the abstract.

### 3.5 Concrete security numbers, pre-collapse

Current practice prices the assumption directly: 128-bit symmetric security means an attacker needs ~2^128 operations — roughly 3.4 × 10^38 AES evaluations, thermodynamically absurd at planetary scale. RSA-2048 offers ~112-bit security against the general number field sieve, whose exponent 2^{O(n^{1/3} (log n)^{2/3})} shrinks only as subexponential structure in the modulus's factoring problem. NIST's post-quantum standards (Kyber, Dilithium, SPHINCS+) rest on lattice and hash assumptions chosen to survive *quantum* attacks — Shor's algorithm for factoring/discrete log, Grover's quadratic speedup on key search — not to survive a polynomial-time SAT solver. Every one of these numbers assumes a computational world in which NP search problems stay exponential on average. The precursors knew this was the bet: John Nash's 1955 letter to the NSA argued that "for almost all sufficiently complex types of enciphering… the mean key computation length increases exponentially with the length of the key," while admitting he could not prove it; Gödel's 1956 letter to von Neumann observed that a machine deciding yes-or-no questions in K·n² time "would have consequences of the greatest magnitude" for mathematics itself. Cryptography is civilization's largest deployed bet on P ≠ NP.

## 4. If P = NP: The World After, and the Defenses

### 4.1 The collapse cascade

Suppose tomorrow a constructive, polynomial-time SAT algorithm appears — and set aside for a moment the question of its exponent. By Karp's reductions, every NP-complete problem falls: TSP, integer programming, scheduling, k-Colorability, Subset Sum, timetabling, protein lattice-folding formulations, chip floorplanning, logistics routing. Aaronson's survey works out the second-order effects with precision:

- **Witnesses become findable, not just checkable.** For every language in NP and every verifier, there is a polynomial-time algorithm that outputs an accepting witness. Decision-to-search: free.
- **All NP optimization problems are solvable in polynomial time** by binary search on the threshold — optimal rather than heuristic answers for the entire operations-research canon.
- **Counting collapses partway.** By Stockmeyer's theorem, any #P function (permanent, partition function, model counting) becomes approximable to within 1 ± 1/p(n) in polynomial time.
- **The polynomial hierarchy unwinds to P**, NP = coNP, and by Ladner's theorem's contrapositive there are *no* NP-intermediate problems — factoring and graph isomorphism join SAT in P.
- **Mathematics automates.** Deciding whether a statement has a ZF-set-theory proof of at most n symbols is an NP problem. A practical P = NP algorithm could, in Aaronson's words, solve "not merely one Millennium Problem but *all seven*" by searching for formal proofs of the other six at, say, 10^12 symbols or fewer. Gödel's 1956 prediction — the "mental effort of the mathematician… completely replaced by machines" for yes-or-no questions — executes.
- **Machine learning closes on verifiable creativity.** Any concept class whose outputs are efficiently verifiable becomes learnable: as Aaronson notes, composing Mozart-grade symphonies would reduce to training a recognizer for great art, because *generating* a verified-good artifact is an NP search problem. Program synthesis from input-output examples, minimal-circuit discovery, and Kolmogorov-style compression of Wikipedia-sized corpora all become "merely" NP search problems that one could "seriously contemplate."

Not everything falls. Chess and Go optimal play are PSPACE-complete, so they stay hard pending P = PSPACE (the problem class one level up in space, not time). Finding Nash equilibria is PPAD-complete — as close to NP-hard as possible given that the decision version is trivial — and may survive. #P *exact* counting may remain infeasible even with P = NP. And P = NP does **not** imply BQP = P: some quantum-sampling tasks could stay classically hard even in Algorithmica.

### 4.2 Cryptography: what dies, in what order

Wikipedia's summary of the consensus is blunt: a constructive, practical solution to any NP-complete problem "would break most existing cryptosystems." The order of collapse:

1. **Public-key cryptography dies first.** RSA, Diffie–Hellman, elliptic curves, and lattice schemes (Kyber, Dilithium) all rest on NP search problems — factoring, discrete log, Learning-With-Errors — whose solving instances become polynomial-time. Note the uncomfortable fact: NIST's post-quantum migration, the entire current defense against Shor's algorithm, defends against the *wrong* adversary for this scenario. PQC is quantum-hardened but P=NP-soft.
2. **Hashing and symmetric crypto die second.** Preimage and collision finding are NP search problems; by reduction to SAT they become polynomial (a cited 2007 literature already encodes hash inversion as SAT instances). Bitcoin and the entire blockchain sector — proof-of-work plus SHA-256 — lose their security model. AES key recovery from known plaintexts becomes a SAT instance: find k such that E_k(m) = c. Signatures from OWFs (Lamport, SPHINCS+, RSA signatures) die with the primitives.
3. **Provable-security guarantees die third.** Every reduction-based proof — IND-CPA, IND-CCA, simulation security — quantifies over polynomial-time adversaries. In Algorithmica, the adversary class includes the honest parties' own capabilities; there is no gap left to hide in.

The Wikipedia extract carries the quantitative caveat that determines how catastrophic the collapse actually is: an O(N²) SAT algorithm with reasonable constants would be "disastrous" — the OpenSSL stack is gone within months — while an Ω(N⁴) algorithm with poor constants "would not pose an immediate practical danger." The threat scales with the exponent and constants, not with the truth of the theorem.

### 4.3 The "useless algorithm" scenario

P = NP could hold with the exponent so large that nothing practical changes: an n^1000 algorithm is slower than 1.0000001^n brute force for every physically realizable input. Aaronson catalogs the historical precedent the other way: when the first polynomial algorithms for linear programming, primality testing, and Markov-chain Monte Carlo arrived with poor exponents, later work drove exponents down and practical constants collapsed; empirically, "polynomial time" and "efficient in practice" correlate strongly. He also notes Knuth's speculation that P = NP might be proven Robertson–Seymour style — non-constructively, with *no bound on the exponent* — in which case Levin's universal search (which is optimal up to polynomial factors if P = NP, but "enormously impractical" even then) would be the only algorithm anyone has. From this angle, P = NP "simply serves as a marker of ignorance." Defense planning must therefore be conditioned on the exponent: n² with decent constants is game over; n^50 buys decades of triage.

### 4.4 The defense stack

If the computational assumptions fail, security must be re-founded on things that are not computational assumptions. The stack, from strongest to weakest:

**Layer 1 — Information-theoretic security.** Shannon (1949) proved the one-time pad perfectly secret — ciphertext leaks zero information about plaintext, regardless of the adversary's computing power, because the proof quantifies over unbounded adversaries. OTP survives P = NP by definition; its costs are the key-distribution and key-hygiene burden (keys as long as the message, used exactly once, physically delivered). Quantum key distribution (BB84 and successors) extends this: security rests on the no-cloning theorem and the no-signalling principle, not on any computational conjecture — Aaronson's survey lists OTP and QKD as exactly the cryptosystems that "don't rely on any computational assumptions." Reported deployments include fiber runs over 1,000 km with twin-field QKD and the Micius satellite's 7,600 km space link. Device-independent QKD, certified by Bell-inequality violations, pushes even hardware trust into physics. Wegman–Carter MACs give information-theoretic authentication with one-time keys; Wyner's wiretap coding and Shamir's secret sharing complete the unconditionally secure toolkit. A fourth strand sits adjacent to this layer: Morimae and Yamakawa (TQC 2022) showed that quantum commitments and signatures exist *without one-way functions*, with security resting on purely quantum-computational assumptions rather than classical ones — relevant to the collapse scenario below, since P = NP does not imply BQP = P.

**Layer 2 — Bounded-space adversaries.** P = NP is a statement about *time*; it says nothing about space. Maurer's bounded-storage model (1992) delivers oblivious transfer and key agreement using a huge public random string plus small private keys, provably secure against any adversary whose *memory* is bounded — no computational assumption involved. Dziembowski–Maurer's bounded-retrieval and leakage-resilient models extend this. If SAT is in P but SAT-solvers-for-PSPACE stay exponential, cryptography re-anchored in space bounds survives Algorithmica. The catch, noted in the quantum-crypto literature, is that the honest-vs-adversary storage gap can never exceed quadratic — so this layer degrades as storage gets cheap, and it inherits its own engineering race.

**Layer 3 — Physics-based trust.** Physically unclonable functions, tamper-resistant hardware, secure enclaves, and air gaps shift the trust base from mathematics to manufacturing. They do not make inversion impossible — an enclave still runs circuits — but they move the attack surface from "solve a SAT instance" to "deprocess a chip or suborn a fab," a materially different and slower threat model.

**Layer 4 — Exponent arbitrage and frugality.** If the collapse algorithm is n^c with large c, then protocol design becomes a race to shrink instance sizes: short-lived keys, ephemeral sessions, minimal message lengths, segmentation so every SAT instance the attacker must solve is small. This is triage, not security — it buys time proportional to how bad c is, and Wikipedia's Ω(N⁴)-is-safe footnote shows even the experts price defenses this way. Fine-grained cryptography (Section 2.5) is the formal research program behind this layer: Ball et al.'s protocols already quantify security as a polynomial exponent gap between honest parties and adversaries, and their proofs of useful work remain sound under fine-grained assumptions that never mention superpolynomial hardness.

**Layer 5 — Data-at-rest and operational doctrine.** "Harvest-now, decrypt-later" — the current argument for post-quantum migration — becomes moot in the wrong direction: stored ciphertexts are retroactively breakable, so the only data-at-rest defenses are OTP encryption or destruction. Long-lived secrets (root keys, genome records, state archives) require pre-collapse re-encryption under information-theoretic schemes or physical custody. Institutional threat models pivot from mathematics to supply chain, side channels, and insider risk.

**What does *not* defend:** post-quantum cryptography (computational, quantum-specific), larger RSA/ECC moduli (polynomial time is polynomial time), longer symmetric keys (2^128 key search becomes a poly-size SAT instance — the known-plaintext constraints do the work), proof-of-work, and Merkle-tree structures built on hash preimage resistance. Also worth stating precisely: the Bennett–Brassard–Breidbart paper "Quantum Cryptography II: How to re-use a one-time pad safely even if P = NP" (1982, reprinted in Natural Computing 2014) and Damgård–Pedersen–Salvail's follow-up ("…almost optimally even if P = NP," Natural Computing 2014) show that even the OTP's most painful constraint — never reusing a pad — has partial, information-theoretic relaxations that remain valid *expressly in the P = NP world*. The literature anticipated the collapse and preserved a residual toolkit inside it.

### 4.5 The honest summary

The world after P = NP is Algorithmica, and Algorithmica is not post-apocalyptic — it is post-assumption. Optimization gets exact; proof search gets automated; the verify-generate asymmetry that underwrites both cryptography and, arguably, a slice of human economic value (the premium on finding what is hard to find) compresses toward the cost of verification itself. The defense is a migration down the stack: from computational hardness, which would be dead, to information theory, physics, and space bounds, which would not be. Complexity theory's own contribution is the map: the five-worlds taxonomy says exactly which cryptographic structures die with which assumptions, and the barrier results say exactly why nobody will see it coming by proof. P ≠ NP is the load-bearing wall of the digital economy, and the entire field's fifty-year failure to prove it — relativized, naturalized, and algebrized out of every known technique — is the strongest empirical evidence that the wall will keep holding.
